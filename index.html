<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Chat</title>
  <style>
    /* 1. Set the background of the whole page to dark so it matches Giscus */
    body {
      background-color: #0d1117; 
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      box-sizing: border-box;
    }

    /* 2. Style the "Reddit Card" container */
    .reddit-container {
      width: 100%;
      max-width: 850px; /* Keeps the feed at a comfortable, readable Reddit-style width */
      background-color: #161b22; /* Slightly lighter dark background for contrast */
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      box-sizing: border-box;
    }

    /* 3. Style the Reddit Header */
    .forum-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
      padding-bottom: 20px;
      border-bottom: 1px solid #30363d;
    }

    .header-info {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      width: 100%;
    }

    /* The orange r/ icon */
    .community-avatar {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, #ff4500, #ff5722); /* Reddit Orange */
      border-radius: 50%;
      color: white;
      font-weight: bold;
      font-size: 1.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      flex-shrink: 0;
    }

    .forum-title {
      margin: 0;
      font-size: 1.5rem;
      color: #f0f6fc;
      font-weight: 600;
    }

    .forum-subtitle {
      margin: 4px 0 0 0;
      font-size: 0.9rem;
      color: #8b949e;
    }

    /* 4. Category Selector Styling (Centered & Expanded) */
    .category-control {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      gap: 8px;
    }

    .category-label {
      font-size: 0.8rem;
      color: #8b949e;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .category-select {
      width: 100%;
      max-width: 500px; /* Gives the dropdown a much longer width */
      background-color: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: 500;
      outline: none;
      cursor: pointer;
      text-align: center; /* Centers the text inside the dropdown */
      transition: background-color 0.2s, border-color 0.2s;
      box-sizing: border-box;
    }

    .category-select:hover {
      background-color: #30363d;
      border-color: #8b949e;
    }

    .category-select:focus {
      border-color: #58a6ff;
    }
  </style>
</head>
<body>

  <!-- This is the card holding everything -->
  <div class="reddit-container">
    
    <!-- Header -->
    <div class="forum-header">
      <div class="header-info">
        <div class="community-avatar">r/</div>
        <div>
          <h2 class="forum-title">Community Chat</h2>
          <p class="forum-subtitle">Upvote, reply, and share your thoughts!</p>
        </div>
      </div>

      <!-- Category Dropdown (Centered and Longer) -->
      <div class="category-control">
        <label for="categorySelect" class="category-label">Select Category</label>
        <select id="categorySelect" class="category-select">
          <!-- Add your category options here -->
          <option value="General" data-id="DIC_kwDOTqRWxM4DCdX-">General</option>
          <option value="Q&A" data-id="YOUR_QA_CATEGORY_ID">Q&A</option>
          <option value="Ideas" data-id="YOUR_IDEAS_CATEGORY_ID">Ideas</option>
          <option value="Announcements" data-id="YOUR_ANNOUNCEMENTS_CATEGORY_ID">Announcements</option>
        </select>
      </div>
    </div>

    <!-- Container where Giscus will load -->
    <div id="giscus-wrapper"></div>

  </div>

  <script>
    // Configuration options for Giscus
    const giscusConfig = {
      repo: "treatwashere/treats-community-chat",
      repoId: "R_kgDOTqRWxA",
      mapping: "pathname",
      strict: "0",
      reactionsEnabled: "1",
      emitMetadata: "0",
      inputPosition: "bottom",
      theme: "transparent_dark",
      lang: "en"
    };

    /**
     * Re-initializes and loads Giscus iframe with the selected category.
     */
    function loadGiscus(categoryName, categoryId) {
      const wrapper = document.getElementById('giscus-wrapper');
      
      // Clear previous instance
      wrapper.innerHTML = '';

      // Create new Giscus container element
      const giscusContainer = document.createElement('div');
      giscusContainer.className = 'giscus';
      wrapper.appendChild(giscusContainer);

      // Create and populate the client script
      const script = document.createElement('script');
      script.src = 'https://giscus.app/client.js';
      script.dataset.repo = giscusConfig.repo;
      script.dataset.repoId = giscusConfig.repoId;
      script.dataset.category = categoryName;
      script.dataset.categoryId = categoryId;
      script.dataset.mapping = giscusConfig.mapping;
      script.dataset.strict = giscusConfig.strict;
      script.dataset.reactionsEnabled = giscusConfig.reactionsEnabled;
      script.dataset.emitMetadata = giscusConfig.emitMetadata;
      script.dataset.inputPosition = giscusConfig.inputPosition;
      script.dataset.theme = giscusConfig.theme;
      script.dataset.lang = giscusConfig.lang;
      script.crossOrigin = 'anonymous';
      script.async = true;

      giscusContainer.appendChild(script);
    }

    // Dropdown change listener
    const selectEl = document.getElementById('categorySelect');
    selectEl.addEventListener('change', (e) => {
      const selectedOption = e.target.options[e.target.selectedIndex];
      const categoryName = selectedOption.value;
      const categoryId = selectedOption.getAttribute('data-id');

      loadGiscus(categoryName, categoryId);
    });

    // Initial load with default selected category
    const initialOption = selectEl.options[selectEl.selectedIndex];
    loadGiscus(initialOption.value, initialOption.getAttribute('data-id'));
  </script>

</body>
</html>
